<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weather & Outfit</title>
<style>
*{box-sizing:border-box}html,body{overflow-x:hidden}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(165deg,#16345f,#2a5298 55%,#6ec8e0);color:#fff;min-height:100vh}
.wrap{max-width:960px;margin:auto;padding:16px}h1{font-size:1.45rem;margin:8px 0 12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}.bar input{flex:1 1 140px;min-width:0;padding:10px 12px;border-radius:12px;border:0;font-size:1rem;color:#17324f}
button{padding:10px 14px;border:0;border-radius:12px;background:#ffffff26;color:#fff;font-size:.95rem;cursor:pointer}button:hover,button.on{background:#fff;color:#1e3c72}
.card{background:#ffffff1c;backdrop-filter:blur(10px);border-radius:18px;padding:16px;margin-bottom:14px}
.now{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}@media(max-width:640px){.now{grid-template-columns:1fr}}
.big{font-size:3.4rem;font-weight:720;letter-spacing:-.03em;line-height:1}.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:.95rem;margin-top:8px}
.outfit{text-align:center}.outfit h3{margin:0 0 6px}.outfit ul{padding:0;margin:8px 0 0;list-style:none}.outfit li{margin:3px 0}
.stage{position:relative;width:min(100%,280px);margin:0 auto;border-radius:28px;overflow:hidden;background:linear-gradient(#69b7ee,#d7f3ff 72%,#c6e6b4);box-shadow:0 12px 28px #04142833,inset 0 0 0 1px #ffffff66}
.stage svg{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.ground{position:absolute;z-index:1;left:16%;right:16%;bottom:2.2%;height:16px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(0,0,0,.38),transparent 70%);pointer-events:none}
.figure{position:absolute;left:0;top:0;z-index:2;width:100%;height:auto;opacity:0;transition:opacity .5s ease;transform-origin:50% 100%;animation:bob 4.6s ease-in-out infinite}
.figure.on{position:relative;opacity:1}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
#styles[hidden]{display:none}
.stage.sky-sun{background:linear-gradient(#4ea4e8,#f6e7b2 68%,#b7e4a4)}
.stage.sky-partly{background:linear-gradient(#6eb4ea,#e7f3ff 70%,#c5e6b0)}
.stage.sky-cloud{background:linear-gradient(#8aa4b8,#e3ebf0 72%,#b7c9a4)}
.stage.sky-rain{background:linear-gradient(#4c6274,#9aafbf 70%,#7d9474)}
.stage.sky-snow{background:linear-gradient(#d5e3f0,#f7fbff 66%,#e7eef6)}
.stage.sky-night{background:linear-gradient(#0c1228,#243864 70%,#1a2822)}
.stage.is-night.sky-rain{background:linear-gradient(#141c2c,#3d5166 70%,#243028)}
.stage.is-night.sky-snow{background:linear-gradient(#1a2740,#6d7f99 66%,#d5deea)}
.stage.look-neutral{--tee:#3f8f86;--tee-d:#2c6b64;--shirt:#f7f4ee;--shirt-d:#e3ddd2;--hoodie:#5d6d8e;--hoodie-d:#45516e;--jacket:#8b978f;--jacket-d:#66716b;--coat:#3c4d64;--coat-d:#2a384b;--parka:#2d3f52;--parka-d:#1c2a38;--fur:#f3eadf;--rain:#e0b03a;--rain-d:#b88822;--wind:#d7e6ee;--wind-d:#b5c8d2;--denim:#3c4d6e;--denim-d:#2a3854;--pants:#4a4452;--shorts:#2f7384;--glove:#3e4654;--scarf:#d08a56;--hat:#3f6f86;--accent:#e07a4c;--hair:#5a3d32;--hair-d:#3a271f;--hair-hi:#8d624c}
.stage.look-men{--tee:#3a6ea5;--tee-d:#2a527c;--shirt:#eef3f8;--shirt-d:#d5dee8;--hoodie:#3e5270;--hoodie-d:#2c3b54;--jacket:#667887;--jacket-d:#4c5b68;--coat:#2e3f54;--coat-d:#1e2b3b;--parka:#243446;--parka-d:#162230;--shorts:#2c4f78;--scarf:#2f4f73;--hat:#2f4f73;--hair:#2c241f;--hair-d:#1a1512;--hair-hi:#5a4638;--accent:#d86a3a}
.stage.look-women{--tee:#e38b9a;--tee-d:#c46d7e;--shirt:#fbf3f4;--shirt-d:#f0dfe3;--hoodie:#8d6a86;--hoodie-d:#6d4e68;--jacket:#c98b9c;--jacket-d:#a86d7e;--coat:#6d4c62;--coat-d:#513648;--parka:#5c4158;--parka-d:#3e2c3c;--shorts:#c96b86;--scarf:#d46b7e;--hat:#b85c78;--hair:#7a4636;--hair-d:#4e2c22;--hair-hi:#c4896a;--accent:#e7b23c}
.ink{stroke:#2b2623;stroke-width:2.15;stroke-linejoin:round;stroke-linecap:round}
.thin{fill:none;stroke:#2b2623;stroke-width:1.45;stroke-linecap:round;stroke-linejoin:round}
.seam{fill:none;stroke:#2b2623;stroke-width:1.2;stroke-linecap:round;opacity:.35}
.shade{fill:#000;opacity:.12;stroke:none}.shine{fill:#fff;opacity:.28;stroke:none}
.skin{fill:#f6c7aa}.skin-d{fill:#e7ae90}.blush{fill:#f0a090;opacity:.55;stroke:none}
.part,.hair{display:none}
.stage.show-tee .part-tee,.stage.show-shirt .part-shirt,.stage.show-hoodie .part-hoodie,.stage.show-jacket .part-jacket,.stage.show-coat .part-coat,.stage.show-parka .part-parka,.stage.show-rain .part-rain,.stage.show-wind .part-wind,.stage.show-shorts .part-shorts,.stage.show-jeans .part-jeans,.stage.show-warmpants .part-warmpants,.stage.show-sneakers .part-sneakers,.stage.show-boots .part-boots,.stage.show-rainboots .part-rainboots,.stage.show-snowboots .part-snowboots,.stage.show-gloves .part-gloves,.stage.show-scarf .part-scarf,.stage.show-hat .part-hat,.stage.show-sunglasses .part-sunglasses,.stage.show-umbrella .part-umbrella{display:inline}
.stage.look-neutral .hair-neutral,.stage.look-men .hair-men,.stage.look-women .hair-women{display:inline}
.stage.show-umbrella .hand-left{display:none}
.cut-men,.cut-women,.cut-neutral{display:none}
.stage.look-men .cut-men,.stage.look-women .cut-women,.stage.look-neutral .cut-neutral{display:inline}
.fx{opacity:0;transition:opacity .4s ease}
.sky-sun .sun,.sky-partly .sun,.sky-partly .clouds,.sky-cloud .clouds,.sky-rain .clouds,.sky-rain .drops,.sky-snow .clouds,.sky-snow .flakes,.sky-night .stars,.sky-night .moon{opacity:1}
.stage.wind-1 .gusts,.stage.wind-2 .gusts{opacity:.8}
#fig{transform-box:view-box;transform-origin:180px 575px;animation:breathe 4.4s ease-in-out infinite}
.sway{transform-box:view-box}
.sway-hair{transform-origin:180px 70px}.sway-scarf{transform-origin:180px 175px}.sway-hem{transform-origin:180px 300px}.sway-back{transform-origin:160px 120px}
.stage.wind-1 .sway-hair,.stage.wind-1 .sway-back{animation:swayA 2.8s ease-in-out infinite}
.stage.wind-1 .sway-scarf,.stage.wind-1 .sway-hem{animation:swayA 2.4s ease-in-out infinite}
.stage.wind-2 .sway-hair,.stage.wind-2 .sway-back{animation:swayB 1.45s ease-in-out infinite}
.stage.wind-2 .sway-scarf,.stage.wind-2 .sway-hem{animation:swayB 1.25s ease-in-out infinite}
.lid{transform-box:fill-box;transform-origin:center top;animation:blink 6.2s infinite}
.drops path{animation:fall 1.35s linear infinite}.drops path:nth-child(odd){animation-duration:1.6s}
.flakes path{animation:snowfall 4.4s linear infinite}
.flakes path:nth-child(2){animation-delay:-.7s}.flakes path:nth-child(3){animation-delay:-1.5s}.flakes path:nth-child(4){animation-delay:-2.3s}.flakes path:nth-child(5){animation-delay:-3.1s}.flakes path:nth-child(6){animation-delay:-1.1s}
.gusts path{animation:blow 1.8s linear infinite}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.01,1.016)}}
@keyframes swayA{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(2.4deg)}}
@keyframes swayB{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5.5deg)}}
@keyframes blink{0%,88%,100%{transform:scaleY(.06)}91%,95%{transform:scaleY(1)}93%{transform:scaleY(.12)}}
@keyframes fall{0%{transform:translateY(-20px);opacity:0}18%{opacity:.9}100%{transform:translateY(560px);opacity:.15}}
@keyframes snowfall{0%{transform:translateY(-16px);opacity:0}15%{opacity:1}100%{transform:translate(12px,520px);opacity:.2}}
@keyframes blow{0%{transform:translateX(-16px);opacity:0}20%{opacity:.7}100%{transform:translateX(40px);opacity:0}}
@media(prefers-reduced-motion:reduce){.stage *,.figure,.sway,.lid,.drops path,.flakes path,.gusts path{animation:none !important;transition:none !important}}
.strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}.h{min-width:70px;text-align:center;background:#ffffff1a;border-radius:12px;padding:8px}
.day{display:grid;grid-template-columns:90px 40px 90px 1fr;gap:8px;align-items:center;padding:10px 8px;border-bottom:1px solid #ffffff22;border-radius:12px;cursor:pointer;text-align:left;width:100%}
.day:last-child{border-bottom:0}.day:hover,.day:focus-visible{background:#ffffff18;outline:none}.day.sel{background:#ffffff33;box-shadow:inset 0 0 0 2px #fff}
@media(max-width:640px){.day{grid-template-columns:70px 30px 80px}.day .ol{grid-column:1/-1;font-size:.9rem}.big{font-size:3rem}}
small,.muted{opacity:.85}.err{color:#ffd2d2}.note{display:block;margin-top:6px;line-height:1.35}
</style></head><body><div class="wrap">
<h1>🌤️ Weather & What to Wear</h1>
<div class="bar"><input id="q" placeholder="Search a city…" autocomplete="off"><button id="go">Search</button><button id="loc">📍 Use my location</button></div>
<div class="bar" id="styles"><button data-s="men">Men's</button><button data-s="women">Women's</button><button data-s="neutral" class="on">Neutral</button></div>
<div id="msg" class="muted"></div>
<div class="card now"><div><div id="place" style="font-size:1.15rem">Loading…</div><div class="big" id="temp">--</div><div id="desc"></div>
<div class="stats" id="stats"></div></div>
<div class="outfit"><h3 id="wear-title">👕 Wear right now</h3>
<div class="stage look-neutral sky-sun show-tee show-shorts show-sneakers show-sunglasses" id="stage">
<svg id="sky" class="sky" data-character="sheet" viewBox="0 0 360 620" aria-hidden="true">
<g class="fx sun" fill="#ffe38a">
  <path d="M292 36c14 0 26 12 26 26s-12 26-26 26-26-12-26-26 12-26 26-26z"/>
  <path class="shine" d="M286 46c6-2 14 0 16 6 2 8-6 12-12 8-6-2-8-10-4-14z"/>
  <g stroke="#ffe38a" stroke-width="4" stroke-linecap="round" fill="none"><path d="M292 18v10M292 80v10M266 62h10M308 62h12M272 40l7 7M306 76l7 7M272 84l7-7M306 48l7-7"/></g>
</g>
<g class="fx moon"><path fill="#f6f1c8" d="M300 40c12 2 20 14 18 26-8 2-18-2-24-10-6-10-4-18 6-16z"/><path fill="#243864" d="M292 46c8 0 14 6 14 8-8 4-16 2-20-4 0-4 2-4 6-4z"/></g>
<g class="fx stars" fill="#fff"><path d="M48 40l1.4 3.2 3.2 1.4-3.2 1.4-1.4 3.2-1.4-3.2-3.2-1.4 3.2-1.4z"/><path d="M86 62l1 2.4 2.4 1-2.4 1-1 2.4-1-2.4-2.4-1 2.4-1z"/><path d="M130 34l1.2 2.6 2.6 1.2-2.6 1.2-1.2 2.6-1.2-2.6-2.6-1.2 2.6-1.2z"/><path d="M214 48l1 2.2 2.2 1-2.2 1-1 2.2-1-2.2-2.2-1 2.2-1z"/><path d="M250 28l1.3 2.8 2.8 1.3-2.8 1.3-1.3 2.8-1.3-2.8-2.8-1.3 2.8-1.3z"/></g>
<g class="fx clouds" fill="#fff"><path d="M46 70c-12 0-18 8-16 16 2 6 10 8 16 6 2 10 16 14 26 8 8 8 22 6 28-2 10 2 20-6 16-16-2-12-16-16-26-10-6-10-22-12-28-2-4-2-10 0-16 0z"/><path opacity=".9" d="M210 96c-8 0-14 6-12 12 6 8 18 8 24 2 6 6 16 4 18-4 2-8-6-14-14-12-4-6-12-4-16 2z"/></g>
<g class="fx drops" fill="#e7f6ff"><path d="M28 18c1.2 8 .2 14-.2 16 .8 0 1.6-6 1.4-16z"/><path d="M64 8c1.2 8 .2 14-.2 16 .8 0 1.6-6 1.4-16z"/><path d="M108 22c1.2 8 .2 14-.2 16 .8 0 1.6-6 1.4-16z"/><path d="M156 6c1.2 8 .2 14-.2 16 .8 0 1.6-6 1.4-16z"/><path d="M210 16c1.2 8 .2 14-.2 16 .8 0 1.6-6 1.4-16z"/><path d="M260 4c1.2 8 .2 14-.2 16 .8 0 1.6-6 1.4-16z"/><path d="M312 20c1.2 8 .2 14-.2 16 .8 0 1.6-6 1.4-16z"/></g>
<g class="fx flakes" fill="#fff" stroke="#7f9cb6" stroke-width="1"><path d="M40 30l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/><path d="M96 16l1.6 4.5 4.5 1.6-4.5 1.6-1.6 4.5-1.6-4.5-4.5-1.6 4.5-1.6z"/><path d="M150 36l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/><path d="M230 18l1.5 4 4 1.5-4 1.5-1.5 4-1.5-4-4-1.5 4-1.5z"/><path d="M300 40l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/><path d="M188 8l1.4 3.6 3.6 1.4-3.6 1.4-1.4 3.6-1.4-3.6-3.6-1.4 3.6-1.4z"/></g>
<g class="fx gusts" fill="none" stroke="#ffffffcc" stroke-width="2" stroke-linecap="round"><path d="M18 250c28-8 40 8 62 0"/><path d="M10 300c36-10 48 10 78 0"/><path d="M24 430c30-6 36 8 58 0"/></g>
</svg>
<div class="ground" aria-hidden="true"></div>
<img id="charA" class="figure on" alt="Outfit for this weather" src="assets/char-sunny-neutral.png">
<img id="charB" class="figure" alt="">
</div>
<ul id="outfit"></ul>
<small class="note muted" id="wear-note">Tap a day below to dress for that forecast</small>
</div></div>
<div class="card"><h3 style="margin-top:0">Next 12 hours</h3><div class="strip" id="hours"></div></div>
<div class="card"><h3 style="margin-top:0">7-day forecast</h3><div id="days"></div></div>
<small id="upd"></small><br><small>Data: Open-Meteo.com · refreshes every 15 min</small>
</div>
<script>
const WMO={0:["Clear sky","☀️"],1:["Mainly clear","🌤️"],2:["Partly cloudy","⛅"],3:["Overcast","☁️"],45:["Fog","🌫️"],48:["Icy fog","🌫️"],51:["Light drizzle","🌦️"],53:["Drizzle","🌦️"],55:["Heavy drizzle","🌧️"],56:["Freezing drizzle","🌧️"],57:["Freezing drizzle","🌧️"],61:["Light rain","🌦️"],63:["Rain","🌧️"],65:["Heavy rain","🌧️"],66:["Freezing rain","🌧️"],67:["Freezing rain","🌧️"],71:["Light snow","🌨️"],73:["Snow","🌨️"],75:["Heavy snow","❄️"],77:["Snow grains","🌨️"],80:["Rain showers","🌦️"],81:["Rain showers","🌧️"],82:["Violent showers","⛈️"],85:["Snow showers","🌨️"],86:["Heavy snow showers","❄️"],95:["Thunderstorm","⛈️"],96:["Thunderstorm w/ hail","⛈️"],99:["Thunderstorm w/ hail","⛈️"]};
const w=c=>WMO[c]||["Unknown","❔"];
const isSnow=c=>[71,73,75,77,85,86].includes(c);
const RAIN=new Set([51,53,55,56,57,61,63,65,66,67,80,81,82,95,96,99]);
const DEMOS={
  sunny:{f:90,rain:0,wind:4,uv:8,code:0},
  warm:{f:76,rain:5,wind:6,uv:4,code:1},
  mild:{f:64,rain:8,wind:6,uv:3,code:2},
  cloudy:{f:54,rain:10,wind:8,uv:2,code:3},
  rain:{f:48,rain:80,wind:12,uv:1,code:63},
  cold:{f:40,rain:10,wind:8,uv:1,code:3},
  freezing:{f:24,rain:15,wind:8,uv:0,code:3}
};
const SHOW_STYLE_TOGGLE=false;
const CHAR_STATES=["sunny","warm","mild","cloudy","rain","cold","freezing"];
// Drop-in art: assets/char-{state}-{style}.png. Men and women use the neutral crop until those files exist.
const CHAR_ART=Object.fromEntries(CHAR_STATES.map(state=>[state,{
  neutral:`assets/char-${state}-neutral.png`,
  men:`assets/char-${state}-neutral.png`,
  women:`assets/char-${state}-neutral.png`
}]));
const LOOKS={
  sunny:{top:"Black tank",bot:"Cargo pants with a tied layer",out:"None needed",shoes:"Sneakers",acc:["🎧 Headphones","🕶️ Sunglasses on head"]},
  warm:{top:"White crop top",bot:"Cargo pants",out:"White jacket",shoes:"Sneakers",acc:["🎧 Headphones"]},
  mild:{top:"Black top",bot:"Cargo pants",out:"Soft jacket",shoes:"Sneakers",acc:["👜 Crossbody bag"]},
  cloudy:{top:"White hoodie",bot:"Cargo pants",out:"Black jacket",shoes:"Sneakers",acc:[]},
  rain:{top:"Dark top",bot:"Dark pants",out:"Yellow raincoat",shoes:"Yellow rain boots",acc:["☂️ Umbrella"]},
  cold:{top:"Black top",bot:"Cargo pants",out:"Puffer jacket",shoes:"Sneakers",acc:["🧢 Beanie","🧣 Neck gaiter"]},
  freezing:{top:"Black top",bot:"Cargo pants",out:"Fur-hood parka",shoes:"Boots",acc:["🎧 Earmuffs","🧣 Scarf"]}
};
let st={lat:39.7391,lon:-75.5398,name:"Wilmington, DE",tz:"America/New_York"},style="neutral",last=null,picked=null,face="A",shownSrc="";
const $=id=>document.getElementById(id);
function activeDemo(){
  if(picked!=null)return null;
  const key=(new URLSearchParams(location.search).get("demo")||"").toLowerCase();
  return DEMOS[key]?{key,...DEMOS[key]}:null;
}
function weatherKey(f,rain,code){
  const snow=isSnow(code),rainy=!snow&&(rain>=40||RAIN.has(code));
  if(snow)return f>32?"cold":"freezing";
  if(rainy)return "rain";
  if(f>=85)return "sunny";
  if(f>=70)return "warm";
  if(f>=60)return "mild";
  if(f>=50)return "cloudy";
  if(f>=32)return "cold";
  return "freezing";
}
function figureSrc(state,styleName){
  const row=CHAR_ART[state]||CHAR_ART.sunny;
  return row[styleName]||row.neutral;
}
function setFigure(state,styleName){
  const src=figureSrc(state,styleName);
  if(src===shownSrc)return;
  shownSrc=src;
  const nextId=face==="A"?"charB":"charA",prevId=face==="A"?"charA":"charB";
  const next=$(nextId),prev=$(prevId);
  const reveal=()=>{next.classList.add("on");prev.classList.remove("on");face=face==="A"?"B":"A";next.alt=$("wear-title").textContent||"Outfit";};
  if(next.getAttribute("src")===src&&next.complete&&next.naturalWidth){reveal();return;}
  next.onload=()=>{next.onload=null;reveal();};
  next.onerror=()=>{next.onerror=null;const fb=(CHAR_ART[state]||CHAR_ART.sunny).neutral;if(next.getAttribute("src")!==fb){shownSrc=fb;next.src=fb;}};
  next.src=src;
}
function outfit(f,rain,wind,uv,code,s){
  const key=weatherKey(f,rain,code);
  const look=LOOKS[key];
  const gust=wind>=25?2:wind>=15?1:0;
  return {key,style:s,top:look.top,bot:look.bot,out:look.out,shoes:look.shoes,acc:look.acc.slice(),wind:gust};
}
function isNight(iso){const h=+String(iso||"").slice(11,13);return h<6||h>=20;}
function scene(code,precip,night){
  let sky="cloud";
  if(isSnow(code))sky="snow";
  else if(RAIN.has(code)||precip>=50)sky="rain";
  else if(code===0||code===1)sky="sun";
  else if(code===2)sky="partly";
  const wet=sky==="rain"||sky==="snow";
  if(night&&!wet)sky="night";
  return {sky,night:!!(night&&wet)};
}
function applyCharacter(o,sky,night,title,note){
  const cls=["stage","look-"+style,"sky-"+sky];
  if(night)cls.push("is-night");
  if(o.wind)cls.push("wind-"+o.wind);
  $("stage").className=cls.join(" ");
  $("wear-title").textContent=title;
  $("wear-note").textContent=note;
  $("outfit").innerHTML=[["👕 Top",o.top],["👖 Bottom",o.bot],["🧥 Outerwear",o.out||"None needed"],["👟 Shoes",o.shoes],["🎒 Extras",o.acc.length?o.acc.join(", "):"None"]].map(([k,v])=>`<li><b>${k}:</b> ${v}</li>`).join("");
  setFigure(o.key,style);
}
function render(d){
  const c=d.current,demo=activeDemo();
  $("place").textContent=st.name;
  const feels=demo?demo.f:c.apparent_temperature,code=demo?demo.code:c.weather_code,wind=demo?demo.wind:c.wind_speed_10m,precip=demo?demo.rain:(c.precipitation_probability??0),uv=demo?demo.uv:c.uv_index,temp=demo?demo.f:c.temperature_2m;
  $("temp").textContent=Math.round(temp)+"°F";
  $("desc").textContent=w(code)[1]+" "+w(code)[0]+(demo?" · demo":"");
  $("stats").innerHTML=`<div>🌡️ Feels ${Math.round(feels)}°</div><div>💨 ${Math.round(wind)} mph</div><div>🌧️ ${precip}% rain</div><div>☀️ UV ${Number(uv).toFixed(1)}</div>`;
  const h=d.hourly,now=c.time.slice(0,13);let i=h.time.findIndex(t=>t.slice(0,13)>=now);if(i<0)i=0;
  $("hours").innerHTML=h.time.slice(i,i+12).map((t,k)=>{const j=i+k,hr=+t.slice(11,13);return`<div class="h"><div>${hr%12||12}${hr<12?"am":"pm"}</div><div style="font-size:1.5rem">${w(h.weather_code[j])[1]}</div><div>${Math.round(h.temperature_2m[j])}°</div><small>💧${h.precipitation_probability[j]??0}%</small></div>`}).join("");
  const D=d.daily;
  if(picked!=null&&!D.time[picked])picked=null;
  $("days").innerHTML=D.time.map((t,j)=>{const dt=new Date(t+"T12:00");const fl=(D.apparent_temperature_max[j]+D.apparent_temperature_min[j])/2;
    const x=outfit(fl,D.precipitation_probability_max[j],D.wind_speed_10m_max[j],D.uv_index_max[j],D.weather_code[j],style);
    const name=j?dt.toLocaleDateString("en-US",{weekday:"long"}):"today";
    return`<div class="day${picked===j?" sel":""}" data-i="${j}" role="button" tabindex="0" aria-pressed="${picked===j}" aria-label="Dress for ${name}"><div><b>${j?dt.toLocaleDateString("en-US",{weekday:"short"}):"Today"}</b><br><small>${dt.toLocaleDateString("en-US",{month:"short",day:"numeric"})}</small></div><div style="font-size:1.6rem" title="${w(D.weather_code[j])[0]}">${w(D.weather_code[j])[1]}</div><div>${Math.round(D.temperature_2m_max[j])}° / ${Math.round(D.temperature_2m_min[j])}°<br><small>💧${D.precipitation_probability_max[j]??0}%</small></div><div class="ol">${x.out||x.top}, ${x.bot.toLowerCase()}${x.acc.length?" + "+x.acc.slice(0,2).join(" "):""}</div></div>`;
  }).join("");
  let dress,sc,title,note;
  if(picked!=null){
    const j=picked,dt=new Date(D.time[j]+"T12:00"),fl=(D.apparent_temperature_max[j]+D.apparent_temperature_min[j])/2;
    dress=outfit(fl,D.precipitation_probability_max[j],D.wind_speed_10m_max[j],D.uv_index_max[j],D.weather_code[j],style);
    sc=scene(D.weather_code[j],D.precipitation_probability_max[j],false);
    const label=j?dt.toLocaleDateString("en-US",{weekday:"long"}):"today";
    title="👕 Wear for "+label;
    note=label.charAt(0).toUpperCase()+label.slice(1)+" "+Math.round(D.temperature_2m_max[j])+"° / "+Math.round(D.temperature_2m_min[j])+"° · tap again for right now";
  }else{
    dress=outfit(feels,precip,wind,uv,code,style);
    sc=scene(code,precip,demo?false:isNight(c.time));
    title="👕 Wear right now";
    note=demo?"Demo: "+demo.key+". Try ?demo=sunny, warm, mild, cloudy, rain, cold, or freezing.":"Tap a day below to dress for that forecast";
  }
  applyCharacter(dress,sc.sky,sc.night,title,note);
  $("upd").textContent="Last updated: "+new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
}
async function load(){$("msg").textContent="";try{const u=`https://api.open-meteo.com/v1/forecast?latitude=${st.lat}&longitude=${st.lon}&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,precipitation_probability,uv_index&hourly=temperature_2m,precipitation_probability,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,apparent_temperature_max,apparent_temperature_min,precipitation_probability_max,wind_speed_10m_max,uv_index_max&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=${encodeURIComponent(st.tz)}&forecast_days=7`;
 const r=await fetch(u);if(!r.ok)throw 0;last=await r.json();render(last);}catch(e){$("msg").innerHTML='<span class="err">Couldn\'t load weather. Check your connection and try again.</span>';}}
async function search(){const q=$("q").value.trim();if(!q)return;try{const r=await(await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=1&language=en&format=json`)).json();
 if(!r.results||!r.results.length){$("msg").innerHTML='<span class="err">City not found.</span>';return;}const p=r.results[0];
 st={lat:p.latitude,lon:p.longitude,name:[p.name,p.admin1,p.country_code].filter(Boolean).join(", "),tz:"auto"};picked=null;load();}catch(e){$("msg").innerHTML='<span class="err">Search failed.</span>';}}
function pickDay(row){if(!row||!last)return;const j=+row.dataset.i;picked=picked===j?null:j;render(last);}
$("go").onclick=search;$("q").onkeydown=e=>{if(e.key==="Enter")search()};
$("loc").onclick=()=>{if(!navigator.geolocation){$("msg").textContent="Location isn't supported here; showing "+st.name+".";return;}
 $("msg").textContent="Finding you…";navigator.geolocation.getCurrentPosition(p=>{st={lat:p.coords.latitude,lon:p.coords.longitude,name:"My location",tz:"auto"};picked=null;load();},
 ()=>{$("msg").textContent="Location access denied; showing "+st.name+" instead.";},{timeout:10000});};
document.querySelectorAll("#styles button").forEach(b=>b.onclick=()=>{style=b.dataset.s;document.querySelectorAll("#styles button").forEach(x=>x.classList.toggle("on",x===b));if(last)render(last);});
if(!SHOW_STYLE_TOGGLE)$("styles").hidden=true;
$("days").onclick=e=>pickDay(e.target.closest(".day"));
$("days").onkeydown=e=>{if(e.key!=="Enter"&&e.key!==" ")return;const row=e.target.closest(".day");if(!row)return;e.preventDefault();pickDay(row);};
load();setInterval(load,15*60*1000);
</script></body></html>
