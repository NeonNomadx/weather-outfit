<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%98%80%EF%B8%8F%3C/text%3E%3C/svg%3E">
<title>Weather & Outfit</title>
<style>
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(165deg,#16345f,#2a5298 55%,#6ec8e0);color:#fff;min-height:100vh}
.wrap{max-width:960px;margin:auto;padding:16px}
h1{font-size:1.45rem;margin:8px 0 12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bar input,.trip-bar input{flex:1 1 140px;min-width:0;max-width:100%;padding:10px 12px;border-radius:12px;border:0;font-size:1rem;color:#17324f}
.bar button,#styles button{padding:10px 14px;border:0;border-radius:12px;background:#ffffff26;color:#fff;font-size:.95rem;cursor:pointer}
#cities:empty{display:none;margin:0}
#cities button{flex:1 1 100%;text-align:left;line-height:1.35;white-space:normal}
.trip-bar{align-items:flex-end}
.trip-bar label{display:flex;flex-direction:column;gap:4px;flex:1 1 8.5rem;min-width:0;font-size:.85rem}
.trip-bar input[type=time]{width:100%}
#trip.on{background:#fff;color:#1e3c72}
.bar button:hover,#styles button:hover,#styles button.on{background:#fff;color:#1e3c72}
.card{background:#ffffff1c;backdrop-filter:blur(10px);border-radius:18px;padding:16px;margin-bottom:14px}
.now-head{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:flex-end}
.place{font-size:1.15rem}
.big{font-size:3.4rem;font-weight:720;letter-spacing:-.03em;line-height:1}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:.95rem;margin-top:8px}
.stage{position:relative;height:min(540px,64vh);width:calc(min(540px,64vh) * 0.5625);max-width:100%;margin:4px auto 12px;border-radius:28px;overflow:hidden;background:linear-gradient(#69b7ee,#d7f3ff 72%,#c6e6b4);box-shadow:0 12px 28px #04142833,inset 0 0 0 1px #ffffff66}
.stage svg{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.ground{position:absolute;z-index:1;left:16%;right:16%;bottom:2.2%;height:16px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(0,0,0,.38),transparent 70%);pointer-events:none}
.figure{position:absolute;left:0;top:0;z-index:2;width:100%;height:100%;object-fit:contain;object-position:center bottom;opacity:0;transition:opacity .5s ease;transform-origin:50% 100%;animation:bob 4.6s ease-in-out infinite}
.figure.on{opacity:1}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
#styles[hidden]{display:none}
.stage.sky-sun{background:linear-gradient(#4ea4e8,#f6e7b2 68%,#b7e4a4)}
.stage.sky-partly{background:linear-gradient(#6eb4ea,#e7f3ff 70%,#c5e6b0)}
.stage.sky-cloud{background:linear-gradient(#8aa4b8,#e3ebf0 72%,#b7c9a4)}
.stage.sky-rain{background:linear-gradient(#4c6274,#9aafbf 70%,#7d9474)}
.stage.sky-snow{background:linear-gradient(#d5e3f0,#f7fbff 66%,#e7eef6)}
.stage.sky-night{background:linear-gradient(#0c1228,#243864 70%,#1a2822)}
.stage.is-night.sky-rain{background:linear-gradient(#141c2c,#3d5166 70%,#243028)}
.stage.is-night.sky-snow{background:linear-gradient(#1a2740,#6d7f99 66%,#d5deea)}
.fx{opacity:0;transition:opacity .4s ease}
.sky-sun .sun,.sky-partly .sun,.sky-partly .clouds,.sky-cloud .clouds,.sky-rain .clouds,.sky-rain .drops,.sky-snow .clouds,.sky-snow .flakes,.sky-night .stars,.sky-night .moon{opacity:1}
.stage.wind-1 .gusts,.stage.wind-2 .gusts{opacity:.8}
.drops path{animation:fall 1.35s linear infinite}
.drops path:nth-child(odd){animation-duration:1.6s}
.flakes path{animation:snowfall 4.4s linear infinite}
.flakes path:nth-child(2){animation-delay:-.7s}.flakes path:nth-child(3){animation-delay:-1.5s}.flakes path:nth-child(4){animation-delay:-2.3s}.flakes path:nth-child(5){animation-delay:-3.1s}.flakes path:nth-child(6){animation-delay:-1.1s}
.gusts path{animation:blow 1.8s linear infinite}
@keyframes fall{0%{transform:translateY(-20px);opacity:0}18%{opacity:.9}100%{transform:translateY(560px);opacity:.15}}
@keyframes snowfall{0%{transform:translateY(-16px);opacity:0}15%{opacity:1}100%{transform:translate(12px,520px);opacity:.2}}
@keyframes blow{0%{transform:translateX(-16px);opacity:0}20%{opacity:.7}100%{transform:translateX(40px);opacity:0}}
@media(prefers-reduced-motion:reduce){
  .stage *,.figure,.drops path,.flakes path,.gusts path{animation:none !important;transition:none !important}
}
.rec{position:relative;background:#f2f2f4;color:#1c1c1e;border-radius:22px;padding:16px 16px 14px;margin:0 0 14px;box-shadow:0 10px 28px #04142829}
.rec h2{margin:0 36px 12px 0;font-size:1.22rem;line-height:1.2;letter-spacing:-.02em;font-weight:760}
.rec-ico{position:absolute;top:14px;right:14px;font-size:1.25rem;line-height:1}
.rec-cols{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px}
.rec .k{color:#6e6e73;font-size:.98rem}
.rec .t{font-size:2.35rem;font-weight:760;letter-spacing:-.03em;line-height:1.05;margin:2px 0 1px;color:#111}
.rec .s{color:#6e6e73;font-size:.98rem}
.rec hr{border:0;border-top:1px solid #d8d8de;margin:12px 0}
.rec .items{margin:0 0 10px;font-size:1.05rem;line-height:1.38}
.rec .items b{font-weight:760}
.rec .tip{display:flex;gap:8px;align-items:flex-start;margin:0;font-size:1.02rem;line-height:1.38}
.rec .tip .bulb{flex:0 0 auto;font-size:1.1rem;line-height:1.3}
.strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.h{min-width:70px;text-align:center;background:#ffffff1a;border-radius:12px;padding:8px}
.day{display:grid;grid-template-columns:90px 40px 90px 1fr;gap:8px;align-items:center;padding:10px 8px;border:0;border-bottom:1px solid #ffffff22;border-radius:12px;cursor:pointer;text-align:left;width:100%;color:inherit;background:transparent;font:inherit}
.day:last-child{border-bottom:0}
.day:hover,.day:focus-visible{background:#ffffff18;outline:none}
.day.sel{background:#ffffff33;box-shadow:inset 0 0 0 2px #fff}
@media(max-width:640px){
  .day{grid-template-columns:70px 30px 80px}
  .day .ol{grid-column:1/-1;font-size:.9rem}
  .big{font-size:3rem}
  .rec .t{font-size:2.05rem}
}
small,.muted{opacity:.85}
.err{color:#ffd2d2}
.note{display:block;margin-top:6px;line-height:1.35}
</style>
</head>
<body>

<g class="fx gusts" fill="none" stroke="#ffffffcc" stroke-width="2" stroke-linecap="round"><path d="M18 250c28-8 40 8 62 0"/><path d="M10 300c36-10 48 10 78 0"/><path d="M24 430c30-6 36 8 58 0"/></g>
</svg>
<div class="ground" aria-hidden="true"></div>
<img id="charA" class="figure on" alt="Outfit for this weather" width="720" height="1280" src="assets/char-sunny-neutral.webp" srcset="assets/char-sunny-neutral.webp 1x, assets/char-sunny-neutral@2x.webp 2x">
<img id="charB" class="figure" alt="" width="720" height="1280">
</div>
<section class="rec" id="rec" aria-live="polite">
  <h2 id="rec-title">Outfit recommendation</h2>
  <span class="rec-ico" id="rec-ico" aria-hidden="true">🌤️</span>
  <div class="rec-cols">
    <div>
      <div class="k" id="rec-left-k">Right now</div>
      <div class="t" id="rec-left-t">--°</div>
      <div class="s" id="rec-left-s">Feels like --°</div>

    <div>
      <div class="k" id="rec-right-k">Later</div>
      <div class="t" id="rec-right-t">--°</div>
      <div class="s" id="rec-right-s">--</div>

  </div>
  <hr>
  <p class="items" id="rec-items"><b>Recommended:</b> <span id="rec-wear">…</span></p>

</section>
<small class="note muted" id="wear-note">Tap a day below to dress for that forecast</small>
<div class="card"><h3 style="margin-top:0">Next 12 hours</h3><div class="strip" id="hours"></div></div>
<div class="card"><h3 style="margin-top:0">7-day forecast</h3><div id="days"></div></div>
<small id="upd"></small><br><small>Data: Open-Meteo.com · refreshes every 15 min</small>
</div>
<script>
const WMO={0:["Clear","☀️"],1:["Mainly clear","🌤️"],2:["Partly cloudy","⛅"],3:["Overcast","☁️"],45:["Fog","🌫️"],48:["Icy fog","🌫️"],51:["Light drizzle","🌦️"],53:["Drizzle","🌦️"],55:["Heavy drizzle","🌧️"],56:["Freezing drizzle","🌧️"],57:["Freezing drizzle","🌧️"],61:["Light rain","🌦️"],63:["Rain","🌧️"],65:["Heavy rain","🌧️"],66:["Freezing rain","🌧️"],67:["Freezing rain","🌧️"],71:["Light snow","🌨️"],73:["Snow","🌨️"],75:["Heavy snow","❄️"],77:["Snow grains","🌨️"],80:["Rain showers","🌦️"],81:["Rain showers","🌧️"],82:["Violent showers","⛈️"],85:["Snow showers","🌨️"],86:["Heavy snow showers","❄️"],95:["Thunderstorm","⛈️"],96:["Thunderstorm w/ hail","⛈️"],99:["Thunderstorm w/ hail","⛈️"]};
const w=c=>WMO[c]||["Unknown","❔"];
const SNOW=new Set([71,73,75,77,85,86]);
const FREEZING_PRECIP=new Set([56,57,66,67]);
const RAIN_CODES=new Set([51,53,55,61,63,65,80,81,82,95,96,99]);
const BANDS=["sunny","warm","mild","cloudy","cold","freezing"];
const SHOW_STYLE_TOGGLE=false;
const CHAR_STATES=["sunny","warm","mild","cloudy","rain","cold","freezing"];
// state + style -> file. Men and women use the neutral art.
const CHAR_ART=Object.fromEntries(CHAR_STATES.map(state=>[state,{
  neutral:`assets/char-${state}-neutral.webp`,
  men:`assets/char-${state}-neutral.webp`,
  women:`assets/char-${state}-neutral.webp`
}]));
// What she is actually wearing in each illustration.
const WEAR={
  sunny:["a black crop top","olive cargo pants","a sweatshirt tied at the waist","white sneakers","sunglasses","headphones"],
  warm:["a white crop top","a gray zip jacket","charcoal cargo pants","white sneakers","sunglasses"],
  mild:["a long-sleeve crop top","black cargo pants","white sneakers","a crossbody bag"],
  cloudy:["a cream hoodie","a black bomber jacket","blue cargo jeans","white sneakers"],
  rain:["a black crop top","black leggings","a yellow raincoat","yellow rain boots","an umbrella"],
  cold:["a black turtleneck","a navy puffer jacket","black cargo pants","high-top sneakers","a beanie","gloves"],
  freezing:["a parka with a fur hood","gray cargo pants","brown boots","earmuffs","a scarf","gloves"]
};
const DEMOS={
  sunny:{f:92,temp:94,rain:0,amount:0,wind:6,gust:10,uv:8,code:0,later:{temp:80,feels:78,code:1,label:"Later tonight"}},
  warm:{f:76,temp:78,rain:5,amount:0,wind:8,gust:12,uv:5,code:1,later:{temp:66,feels:64,code:2,label:"This evening"}},
  mild:{f:64,temp:66,rain:10,amount:0,wind:8,gust:14,uv:3,code:2,later:{temp:56,feels:54,code:3,label:"Later tonight"}},
  cloudy:{f:54,temp:55,rain:15,amount:0,wind:10,gust:16,uv:2,code:3,later:{temp:48,feels:46,code:3,label:"Later tonight"}},
  rain:{f:58,temp:60,rain:80,amount:1.4,wind:14,gust:22,uv:1,code:63,later:{temp:55,feels:52,code:61,label:"This evening",rain:70}},
  cold:{f:40,temp:42,rain:10,amount:0,wind:12,gust:18,uv:1,code:3,later:{temp:34,feels:30,code:3,label:"Later tonight"}},
  freezing:{f:24,temp:26,rain:30,amount:0.4,wind:12,gust:20,uv:0,code:71,later:{temp:22,feels:18,code:73,label:"Later tonight"}}
};
let tripMode=false;
let st={lat:39.7391,lon:-75.5398,name:"Wilmington, DE",tz:"America/New_York"},style="neutral",last=null,picked=null,face="A",shownSrc="";
const US_STATE={"Alabama":"AL","Alaska":"AK","Arizona":"AZ","Arkansas":"AR","California":"CA","Colorado":"CO","Connecticut":"CT","Delaware":"DE","District of Columbia":"DC","Florida":"FL","Georgia":"GA","Hawaii":"HI","Idaho":"ID","Illinois":"IL","Indiana":"IN","Iowa":"IA","Kansas":"KS","Kentucky":"KY","Louisiana":"LA","Maine":"ME","Maryland":"MD","Massachusetts":"MA","Michigan":"MI","Minnesota":"MN","Mississippi":"MS","Missouri":"MO","Montana":"MT","Nebraska":"NE","Nevada":"NV","New Hampshire":"NH","New Jersey":"NJ","New Mexico":"NM","New York":"NY","North Carolina":"NC","North Dakota":"ND","Ohio":"OH","Oklahoma":"OK","Oregon":"OR","Pennsylvania":"PA","Rhode Island":"RI","South Carolina":"SC","South Dakota":"SD","Tennessee":"TN","Texas":"TX","Utah":"UT","Vermont":"VT","Virginia":"VA","Washington":"WA","West Virginia":"WV","Wisconsin":"WI","Wyoming":"WY"};
function placeName(p){
  const region=p.country_code==="US"&&US_STATE[p.admin1]?US_STATE[p.admin1]:p.admin1;
  const bits=[p.name,region];
  if(p.country_code&&p.country_code!=="US")bits.push(p.country_code);
  return bits.filter(Boolean).join(", ");
}
const $=id=>document.getElementById(id);
function activeDemo(){
  if(picked!=null)return null;
  const key=(new URLSearchParams(location.search).get("demo")||"").toLowerCase();
  return DEMOS[key]?{key,...DEMOS[key]}:null;
}
function listPhrase(items){
  const nice=items.slice();
  if(!nice.length)return "";
  nice[0]=nice[0].charAt(0).toUpperCase()+nice[0].slice(1);
  if(nice.length===1)return nice[0];
  if(nice.length===2)return nice[0]+" and "+nice[1];
  return nice.slice(0,-1).join(", ")+", and "+nice[nice.length-1];
}
function tempBand(feels,code){
  const clear=code===0||code===1;
  if(feels>=85&&clear)return "sunny";
  if(feels>=70)return "warm";
  if(feels>=60)return "mild";
  if(feels>=50)return "cloudy";
  if(feels>=32)return "cold";
  return "freezing";
}
function colder(band){
  const i=BANDS.indexOf(band);
  return BANDS[Math.min(BANDS.length-1,Math.max(0,i)+1)];
}
function strongWind(wind,gust){return (wind||0)>=20||(gust||0)>=28;}
function wetKind(hr){
  const code=hr.code|0;
  if(SNOW.has(code)||FREEZING_PRECIP.has(code))return "snow";
  if(RAIN_CODES.has(code)||(hr.pop||0)>=50||(hr.amount||0)>=0.2)return "rain";
  return "";
}
function classify(hours){
  // The outfit matches the current hour only. A colder, wetter, or windier
  // hour later stays in the card tip and does not change what she's wearing.
  const now=hours[0]||{};
  const feels=+now.feels;
  const kind=wetKind(now);
  const strong=strongWind(now.wind,now.gust);
  let key,why;
  if(kind==="snow"){
    key=feels>32?"cold":"freezing";
    if(strong&&key==="cold")key="freezing";
    why="snow";
  }else if(kind==="rain"){
    key="rain";
    why="rain";
  }else{
    key=tempBand(feels,now.code|0);
    if(strong){key=colder(key);why="wind";}
    else why="temp";
  }
  return {key,why,minFeels:feels,strong,rain:kind==="rain",snow:kind==="snow"};
}
function hourOf(iso){return +String(iso||"").slice(11,13);}
function dayOf(iso){return String(iso||"").slice(0,10);}
function addDays(day,n){
  const d=new Date(day+"T12:00:00");
  d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10);
}
function periodLabel(iso,nowIso){
  const hour=hourOf(iso),day=dayOf(iso),today=dayOf(nowIso),tomorrow=addDays(today,1);
  const part=hour<12?"morning":hour<17?"afternoon":hour<21?"evening":"tonight";
  if(day===today){
    if(part==="tonight")return "Later tonight";
    if(part==="evening")return "This evening";
    if(part==="afternoon")return "This afternoon";
    return "This morning";
  }
  if(day===tomorrow){
    if(part==="morning")return "Tomorrow morning";
    if(part==="afternoon")return "Tomorrow afternoon";
    if(part==="evening")return "Tomorrow evening";
    return "Tomorrow night";
  }
  const dt=new Date(day+"T12:00:00");
  const name=dt.toLocaleDateString("en-US",{weekday:"long"});
  return part==="tonight"?name+" night":name+" "+part;
}
function clock(iso){
  const hr=hourOf(iso);
  return (hr%12||12)+(hr<12?" AM":" PM");
}
function rowsFrom(d){
  const h=d.hourly,c=d.current;
  let i=h.time.findIndex(t=>t.slice(0,13)>=c.time.slice(0,13));
  if(i<0)i=0;
  const out=[];
  for(let j=i;j<h.time.length;j++){

    $("cities").replaceChildren();
    load();
  },()=>{$("msg").textContent="Location access denied; showing "+st.name+" instead.";},{timeout:10000});
};
document.querySelectorAll("#styles button").forEach(b=>b.onclick=()=>{
  style=b.dataset.s;
  document.querySelectorAll("#styles button").forEach(x=>x.classList.toggle("on",x===b));
  shownSrc="";
  if(last)render(last);
});
if(!SHOW_STYLE_TOGGLE)$("styles").hidden=true;
$("days").onclick=e=>pickDay(e.target.closest(".day"));
$("days").onkeydown=e=>{
  if(e.key!=="Enter"&&e.key!==" ")return;
  const row=e.target.closest(".day");
  if(!row)return;
  e.preventDefault();
  pickDay(row);
};
load();
setInterval(load,15*60*1000);
</script>
</body>
</html>
